  docs-security:
    name: Wheel scripts, documentation, and artifact security contracts
    runs-on: ubuntu-latest
    needs: build-wheel
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Download tested wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.WHEEL_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/wheel

      - name: Install the wheel without the checkout
        run: |
          python -m venv "$RUNNER_TEMP/contracts-venv"
          wheels=("$RUNNER_TEMP"/wheel/*.whl)
          test "${#wheels[@]}" -eq 1
          "$RUNNER_TEMP/contracts-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/contracts-venv/bin/python" -m pip install \
            "${wheels[0]}[onnx-runtime]" pytest pytest-cov pytest-error-for-skips
          "$RUNNER_TEMP/contracts-venv/bin/python" -m pip check

      - name: Smoke every published console script from the wheel
        run: |
          cd "$RUNNER_TEMP"
          for command in \
            pyimgano \
            pyimgano-artifact \
            pyimgano-benchmark \
            pyimgano-bundle \
            pyimgano-datasets \
            pyimgano-defects \
            pyimgano-demo \
            pyimgano-doctor \
            pyimgano-evaluate \
            pyimgano-export \
            pyimgano-export-onnx \
            pyimgano-export-torchscript \
            pyimgano-features \
            pyimgano-infer \
            pyimgano-manifest \
            pyimgano-robust-benchmark \
            pyimgano-runs \
            pyimgano-synthesize \
            pyimgano-train \
            pyimgano-validate-infer-config \
            pyimgano-weights \
            pyim
          do
            "$RUNNER_TEMP/contracts-venv/bin/$command" --help > /dev/null
          done
          "$RUNNER_TEMP/contracts-venv/bin/python" - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path

          import pyimgano
          from pyimgano.artifacts import ARTIFACT_SCHEMA_VERSION

          source = Path(pyimgano.__file__).resolve()
          assert not source.is_relative_to(Path(os.environ["GITHUB_WORKSPACE"]).resolve()), source
          assert importlib.metadata.version("pyimgano") == pyimgano.__version__
          assert ARTIFACT_SCHEMA_VERSION == 1
          PY

      - name: Run artifact security negative tests from the wheel
        run: |
          mkdir -p "$RUNNER_TEMP/security-tests"
          cp tests/test_artifact_security.py "$RUNNER_TEMP/security-tests/test_artifact_security.py"
          cp tests/test_artifact_security_e2e.py \
            "$RUNNER_TEMP/security-tests/test_artifact_security_e2e.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/contracts-venv/bin/python" -m pytest --no-cov \
            --error-for-skips -q \
            "$RUNNER_TEMP/security-tests/test_artifact_security.py" \
            "$RUNNER_TEMP/security-tests/test_artifact_security_e2e.py"

      - name: Audit documentation commands and release contracts
        run: |
          "$RUNNER_TEMP/contracts-venv/bin/python" tools/audit_repo_links.py
          "$RUNNER_TEMP/contracts-venv/bin/python" -m pytest --no-cov \
            --error-for-skips -q \
            tests/test_trained_artifact_docs_contract.py \
            tests/test_train_export_docs_contract.py \
            tests/test_public_artifact_api.py \
            tests/test_package_version_sync.py \
            tests/test_publishing_docs_contract.py \
            tests/test_publish_workflow_contract.py \
            tests/test_artifact_workflow_contract.py
